<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>B1 — 지하 1층의 아이돌</title>
  <script type="module" crossorigin src="./assets/index-WFQ_-YzC.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BO3EXpZQ.css">
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="fxStage"><i></i><i></i><i></i></div>
    <div id="tapcatch"></div>

    <div id="compass"><div class="marks"></div><div class="center"></div></div>
    <div id="hint"></div>
    <div id="timer"><div></div></div>
    <div id="reticle"></div>
    <div id="dday"></div>

    <div id="phone">
      <div class="screen">
        <div class="fancam">
          <div class="lights"></div>
          <div class="idol a"></div><div class="idol b"></div><div class="idol c"></div>
          <div class="cap">【4K 직캠】큐티 애비뉴 아마네 · 2주년 기념 공연 앵콜</div>
          <div class="bar"><i></i></div>
        </div>
        <div class="chat"><div class="chat-head"></div><div class="chat-body"></div></div>
      </div>
    </div>

    <div id="dialog"><div class="name"></div><div class="text"></div><div class="next">▼</div></div>
    <div id="choices"></div>
    <button id="lookDone"></button>
    <div id="toasts"></div>
    <div id="caption"></div>
    <div id="banner"></div>
    <div id="schedule"></div>
    <div id="result"></div>

    <div id="topbar">
      <button id="btnGyro" title="자이로">📱</button>
      <button id="btnAuto">AUTO</button>
      <button id="btnSkip">SKIP</button>
      <button id="btnLog">LOG</button>
      <button id="btnMenu">≡</button>
    </div>
    <div id="logPanel"></div>

    <div id="fader"></div>
    <div id="chapterCard"><h1></h1><p></p></div>

    <div id="textInput">
      <div class="box">
        <p></p>
        <input />
        <button>결정</button>
      </div>
    </div>

    <div id="panel">
      <div class="sheet">
        <header><h2></h2><button class="close" aria-label="닫기">✕</button></header>
        <div class="body"></div>
      </div>
    </div>

    <div id="title" class="on">
      <div class="logo">
        <small>UNDERGROUND IDOL PRODUCE ADV</small>
        <h1>B1</h1>
        <h2>지하 1층의 아이돌</h2>
      </div>
      <div class="tapstart">TAP TO START</div>
      <div class="menu">
        <button id="btnNew">처음부터</button>
        <button id="btnContinue">이어하기</button>
        <button id="btnLoad">불러오기</button>
        <button id="btnChapters">챕터 선택</button>
        <button id="btnSettings">설정</button>
      </div>
      <p class="tip">🎧 이어폰 권장 · 드래그하거나 📱자이로를 켜서 360° 둘러보기 · v0.2 (프롤로그 + 제1장)</p>
    </div>
  </div>
</body>
</html>
